<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mishitza</title>
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mishitza" />
    <meta name="description" content="Track workouts and exercises with Mishitza." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main id="app"></main>
    </div>

    <div id="dialog-root"></div>

    <template id="home-screen-template">
      <section class="screen screen-home">
        <header class="hero">
          <p id="home-screen-subtitle" class="eyebrow">MISHITZA WORKOUT TRACKER</p>
          <h1 id="home-screen-title">UPPER</h1>
        </header>

        <div id="exercise-list" class="exercise-list"></div>

        <div class="bottom-action" id="home-add-action">
          <div class="card workout-form hidden" id="workout-form-card">
            <label class="field">
              <input id="exercise-name-input" type="text" maxlength="80" placeholder="Exercise name" />
            </label>

            <label class="field">
              <input id="exercise-max-input" type="text" maxlength="30" placeholder="Max (kg, time, reps)" />
            </label>

            <div class="actions add-form-actions">
              <button class="primary-button" id="save-exercise">Add</button>
              <button class="danger-button" id="cancel-home-exercise">Cancel</button>
            </div>
          </div>

          <button class="primary-button add-workout-button" id="show-exercise-form">+ Add exercise</button>
        </div>

        <div id="home-links" class="home-links">
          <button class="text-link" id="export-data">Export</button>
          <button class="text-link" id="import-data">Import</button>
          <input id="import-file-input" class="hidden" type="file" accept="application/json,.json" />
        </div>

        <div id="selected-exercises-action" class="selected-exercises-action hidden">
          <button class="primary-button" id="add-selected-to-workout">Add to workout</button>
          <button class="selection-clear-button" id="clear-selected-exercises" type="button" aria-label="Deselect all exercises">×</button>
        </div>

        <section id="my-workout-screen" class="my-workout-screen hidden" aria-label="My workout">
          <div id="my-workout-list" class="exercise-list"></div>
          <div class="my-workout-action">
            <button class="primary-button" id="complete-my-workout">Workout complete</button>
          </div>
        </section>

        <div class="stopwatch-float">
          <section id="home-stopwatch-popover" class="stopwatch-popover hidden" aria-label="Stopwatch">
            <div id="home-stopwatch" class="stopwatch-time">00:00</div>
            <div class="stopwatch-actions">
              <button class="primary-button" id="toggle-home-stopwatch">Start</button>
              <button class="ghost-button" id="reset-home-stopwatch">Reset</button>
            </div>
          </section>
          <button class="stopwatch-fab" id="toggle-home-stopwatch-popover" type="button" aria-label="Open stopwatch" aria-expanded="false">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M9 2h6v2H9V2Zm3 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm-.75 2.5h1.5V12l2.25 2.25-1.06 1.06L11.25 12.6v-2.1Z"/>
            </svg>
          </button>
        </div>

        <nav class="bottom-nav" aria-label="Home sections">
          <button class="nav-tab" type="button" data-home-tab="upper">Upper</button>
          <button class="nav-tab" type="button" data-home-tab="lower">Lower</button>
          <button class="nav-tab" type="button" data-home-tab="core">Core</button>
          <button class="nav-tab" type="button" data-home-tab="workout">Workout</button>
        </nav>
      </section>
    </template>

    <template id="workout-screen-template">
      <section class="screen screen-workout">
        <div class="section-head workout-head">
          <div class="workout-head-copy">
            <div class="workout-title-row">
              <h2 id="workout-screen-title"></h2>
              <button class="edit-title-button" id="edit-workout-title" aria-label="Edit workout title">
                <span class="edit-icon edit-icon-flipped" aria-hidden="true">✎</span>
              </button>
            </div>
            <input
              id="workout-title-edit-input"
              class="title-edit-input hidden"
              type="text"
              maxlength="60"
              placeholder="Workout title"
            />
            <div class="progress-shell" aria-label="Workout progress">
              <div id="workout-progress-bar" class="progress-bar"></div>
            </div>
          </div>
        </div>

        <div id="exercise-list" class="exercise-list"></div>

        <div class="bottom-action exercise-action">
          <div id="exercise-form" class="card workout-form exercise-form hidden">
            <input id="exercise-name-input" type="text" maxlength="80" placeholder="Exercise name" />
            <input id="exercise-max-input" type="text" maxlength="30" placeholder="Max (kg, time, reps)" />
            <button class="primary-button" id="confirm-add-exercise">Add</button>
            <button class="danger-button" id="cancel-add-exercise">Cancel</button>
          </div>
          <button class="primary-button add-workout-button" id="show-exercise-form">+ Add exercise</button>
        </div>

        <div id="workout-complete-message" class="complete-message hidden">
          <div class="complete-message-card">
            <strong>Workout complete</strong>
            <span>Great job 💪</span>
          </div>
        </div>

        <div class="stopwatch-panel">
          <div id="workout-stopwatch" class="stopwatch-time">00:00</div>
          <div class="stopwatch-actions">
            <button class="primary-button" id="toggle-stopwatch">Start</button>
            <button class="ghost-button" id="reset-stopwatch">Reset</button>
          </div>
        </div>

        <div class="bottom-action">
          <button class="back-button" id="back-home">&lt; Back</button>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
